# ============================================================
#  受管模型清单 —— 这是整个流程唯一需要你手工维护的文件
# ------------------------------------------------------------
#  key      : LiteLLM 价格源里的模型键名（决定去哪取价，必填）
#  name     : 表格里显示的名字（不填则用 key）
#  status   : 状态列文案。⚠ 开头的会被标红
#  note     : 备注列
#  cached   : 只在需要覆盖自动值时才写
#             写 "待核" = 官网未公布，强制留空并标注
#             写数字   = 用你的值，并在报告里提示与源不一致
#  input / output : 同上，用于覆盖自动值（一般不需要）
#  context  : 覆盖自动抓到的上下文长度
#  primary  : true = 主力档（深色底），false/省略 = 老型号（浅色底）
#  expired_ok : true = 明知已过下线日期仍要留在表里（如第一方退役但
#             Bedrock / Vertex 还能调），不再进「已过下线日期」告警
#  manual_only : true = 价格源里没有这一条，价格全部手工填
#  alias    : 源里指向同一个模型的其他 key（如 gpt-5.6 就是 gpt-5.6-sol）。
#             声明了才不会被当成「未纳管的新模型」重复报出来
# ============================================================

# ---- 新模型发现 ----------------------------------------------
# 下面的 providers 白名单只覆盖你登记过的型号；这一块管的是「源里有、
# 你还没登记」的型号，防止厂商发了新模型这边一声不响。
# 整块可以删掉，删了就用 src/discover.py 里的 DEFAULTS。
# 报告里冒出不想看的东西，往 ignore 里加一条正则即可。
discovery:
  providers: [openai, gemini, anthropic, deepseek, xai]   # 源里的 litellm_provider 值
  # responses 必须留着：gpt-5.x-pro / codex 这批在源里 mode 是 responses
  # 而不是 chat，只按 chat 过滤会漏掉 OpenAI 最新的旗舰档
  modes: [chat, responses]
  ignore:
    - '^ft:'                                   # 微调派生条目
    - 'audio'
    - 'realtime'
    - '-tts$'
    - '-live-'
    - 'omni-'
    - 'lyria'                                  # 音乐
    - 'veo'                                    # 视频
    - 'imagen'
    - '-image'
    - 'gemma'                                  # 开源权重
    - 'robotics'
    - 'learnlm'
    - 'embedding'
    - 'moderation'
    - 'rerank'
    - 'container'
    - 'search-preview'
    - 'search-api'
    - 'deep-research'
    - 'computer-use'
    - '-customtools$'
    - '-latest$'                               # 指针别名，永远跟着正式名走
    - '-exp-?\d*$'                             # 实验版
    - '-vision'
    - '-16k$'
    - '^gpt-4-\d{4}-preview$'
    - '^gpt-4-turbo-preview$'

providers:

  - company: OpenAI
    color: "D9EAD3"
    color_alt: "EFF6EA"
    docs: https://developers.openai.com/api/docs/pricing
    watch:                                  # 页面变动监控
      - https://developers.openai.com/api/docs/pricing
      - https://developers.openai.com/api/docs/deprecations
    models:
      - {key: gpt-5.6-sol, name: "gpt-5.6-sol（别名 gpt-5.6）", primary: true, status: 现役旗舰,
         alias: [gpt-5.6],
         note: "2026-07-09 发布。缓存写入 $6.25；>272K 长上下文整单按 $10 / $1 / $45"}
      - {key: gpt-5.6-terra, primary: true, status: 现役, note: "缓存写入 $3.125；长上下文 $5 / $0.50 / $22.50"}
      - {key: gpt-5.6-luna, primary: true, status: 现役, note: "缓存写入 $1.25；长上下文 $2 / $0.20 / $9"}
      - {key: gpt-5.5, primary: true, status: 现役, note: "长上下文 $10 / $1 / $45"}
      - {key: gpt-5.5-pro, primary: true, status: 现役, cached: 无, note: "官方未提供缓存价；长上下文 $60 / $270"}
      - {key: gpt-5.4, primary: true, status: 现役, note: "长上下文 $5 / $0.50 / $22.50"}
      - {key: gpt-5.4-mini, primary: true, status: 现役}
      - {key: gpt-5.4-nano, primary: true, status: 现役}
      - {key: gpt-5.4-pro, primary: true, status: 现役, cached: 无, note: "官方未提供缓存价；长上下文 $60 / $270"}
      - {key: gpt-5.3-codex, primary: true, status: "现役（编程专用）", note: "Priority 档 $3.50 / $0.35 / $28"}
      - {key: gpt-5.2, status: "可调用 · 未公告下线", note: "已折叠到官网 All models 区块，价格未变"}
      - {key: gpt-5.2-pro, status: "可调用 · 未公告下线", cached: 无,
         note: "官方未提供缓存价；仅 Responses API 可调用"}
      - {key: gpt-5.1, status: "可调用 · 未公告下线", note: "同上"}
      - {key: gpt-4.1, status: "可调用 · 未公告下线", note: "1M 上下文，指令遵循好，老项目常用"}
      - {key: gpt-4.1-mini, status: "可调用 · 未公告下线"}
