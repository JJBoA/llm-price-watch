      - {key: gpt-4.1-nano, status: "⚠ 2026-10-23 下线", note: "官方建议换 gpt-5.6-luna"}
      - {key: o4-mini, status: "⚠ 2026-10-23 下线", note: "官方建议换 gpt-5.6-terra"}
